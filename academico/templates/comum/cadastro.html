{% extends 'base.html' %}

{% load static %}

{% block content %}

{% include 'partials/_preloader.html' %}

{% include 'partials/_search_bar.html' %}

{% include 'partials/_header.html' %}

<div class="contact-area section-padding-0-80">

    <section class="container col-6">

        <div class="row">

            <div class="col-12">

                <div class="section-heading">

                    <h2>Criar conta</h2>

                </div>

            </div>

        </div>

        <div class="row">

            <div class="col-12">

                <div class="contact-form-area">

                    <form action="{% url 'cadastro' %}" method="post">
                        {% csrf_token %}

                        <div class="row col-12">

                            <div class="col-12 col-lg-12">

                                <label for="nome"><b>Nome completo</b></label>

                                <input type="text" id="nome" class="form-control" name="nome" placeholder="Ex.: Guilherme Lima" required>

                            </div>

                            <div class="col-12 col-lg-12">

                                <label for="email"><b>Email</b></label>

                                <input type="email" id="email" class="form-control" name="email" placeholder="Ex.: guilherme@receitas.com" required>

                            </div>

                            <div class="col-12 col-lg-6">

                                <label for="senha"><b>Senha</b></label>

                                <input type="password" id="senha" class="form-control" name="senha" placeholder="Digite sua senha" required>

                            </div>

                            <div class="col-12 col-lg-6">

                                <label for="senha2"><b>Confirmação de senha</b></label>

                                <input type="password" id="senha2" class="form-control" name="senha2" placeholder="Digite sua senha mais uma vez" required>

                            </div>

                            <div class="col-12 text-center">

                                <button class="btn btn-success" type="submit">Criar sua conta</button>

                                <button type="button" class="btn btn-primary" onclick="exibirLogin()">Já tem uma conta? Clique aqui</button>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </section>

</div>

<script>

function exibirLogin()

{

     location.href = "{% url 'login' %}";

}

</script>

{% include 'partials/_footer.html' %}

{% endblock %}
