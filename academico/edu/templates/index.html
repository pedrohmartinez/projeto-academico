{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="" name="description">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">

    <title>LabIF</title>

    <link href="{% static 'img/core-img/favicon.ico' %}" rel="icon">

    <link href="{% static 'site.css' %}" rel="stylesheet">

</head>

<body>
<!-- PRELOADER -->
<div id="preloader">
    <i class="circle-preloader"></i>
    <img alt="" src="{% static 'img/core-img/loader.png' %}">
</div>
<!-- BUSCA -->
<div class="search-wrapper">
    <div class="close-btn"><i aria-hidden="true" class="fa fa-times"></i></div>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <form action="#">
                    <input type="search" name="busca" placeholder="Pesquise pelos nossos cursos" >
                    <button type="submit"><i aria-hidden="true" class="fa fa-search"></i></button>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- HEADER -->
<header class="header-area">
    <div class="delicious-main-menu">
        <div class="classy-nav-container breakpoint-off">
            <div class="container">
                <nav class="classy-navbar justify-content-between" id="deliciousNav">
                    <a class="nav-brand" href="#">
                        <img alt="" src="{% static 'img/core-img/iflogo.png' %}"></a>
                    <div class="classy-navbar-toggler">
                        <span class="navbarToggler"><span></span><span></span><span></span></span>
                    </div>
                    <div class="classy-menu">
                        <div class="classycloseIcon">
                            <div class="cross-wrap"><span class="top"></span><span class="bottom"></span></div>
                        </div>
                        <div class="classynav">
                            <ul>
                                <li><a href="{}">Início</a></li>
                                <li><a href="{% url 'cadastro' %}">Cadastro</a></li>
                            </ul>
                            <div class="search-btn">
                                <i aria-hidden="true" class="fa fa-search"></i>
                            </div>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </div>
</header>

<!-- CONTEUDO -->
<section class="best-acad-area">
    <div class="container">
        Conteúdo index
    </div>
</section>

<!-- RODAPE -->
<footer class="footer-area">
    <div class="container h-100">
        <div class="row h-100">
            <div class="col-12 h-100 d-flex flex-wrap align-items-center justify-content-between">
                <div class="footer-social-info text-right">
                    <a href="https://instagram.com/ifgoiano"><i aria-hidden="true" class="fa fa-instagram"></i></a>
                    <a href="https://facebook.com/ifgoiano"><i aria-hidden="true" class="fa fa-facebook"></i></a>
                    <a href="https://twitter.com/ifgoiano"><i aria-hidden="true" class="fa fa-twitter"></i></a>
                    </div>
                <div class="footer-logo">
                    <a href="https://www.ifgoiano.edu.br" target="_blank">IF Goiano</a>
                </div>
            </div>
        </div>
    </div>
</footer>

<!-- jQuery-2.2.4 js -->
<script src="{% static 'js/jquery/jquery-2.2.4.min.js' %}"></script>
<!-- Popper js -->
<script src="{% static 'js/bootstrap/popper.min.js' %}"></script>
<!-- Bootstrap js -->
<script src="{% static 'js/bootstrap/bootstrap.min.js' %}"></script>
<!-- All Plugins js -->
<script src="{% static 'js/plugins/plugins.js' %}"></script>
<!-- Active js -->
<script src="{% static 'js/active.js' %}"></script>

</body>

</html>
